<!DOCTYPE html>
<html>

<head>

  <title>2-do-list</title>

  <link rel="stylesheet" href="main.css">

  <meta name="google-site-verification" content="uSEMJUMefV7l1apHAQh73Q_1485bNXIAeBR-odt7wdA" />

</head>

<body>

  <div class="to-do-container">
    <div class="header">
      <img class="logo" src="images/logo.png" alt="logo">
    </div>

    <div class="tools">
      <input class="text-box js-text-box" type="text" placeholder="What needs to be done?">

      <input class="date-box js-date-box" type="date">

      <button class="add-button js-add-button">Add</button>

      <div class="task-list js-task-list"></div>


    </div>
  </div>

  <script src="main.js"></script>

</body>

</html>
